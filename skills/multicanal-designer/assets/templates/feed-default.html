<!doctype html>
<!-- ESTILO DEFAULT · IG feed 1080x1350. kicker + headline + sub + pill (CTA opcional).
     Use p/ manifesto, tese, persona, FAQ. Mantenha brand.css na MESMA pasta. -->
<html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"></head>
<body class="card canvas--feed">
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
  <div class="brand"><div class="emblem-ph"></div><span class="brand-name">Horus <span class="hub">Hub</span></span></div>
  <div class="body">
    <span class="kicker">{{KICKER}}</span>
    <div class="headline">{{HEADLINE_com_<span class="hl">DESTAQUE</span>}}</div>
    <div class="sub">{{SUBLINHA}}</div>
    <!-- CTA opcional: <div class="pill">{{CTA}}</div> -->
  </div>
  <div class="foot"><span class="handle">@horushub.ia</span>
    <span class="tag">Transformando escritórios de advocac<span class="iabr">[<b>IA</b>]</span> com IA e Marketing Jurídico</span>
    <!-- ou afford. de carrossel: <span class="swipe">arraste →</span> -->
  </div>
</body></html>
