<!doctype html>
<!-- IG CAROUSEL · slide de CONTEÚDO (1 ideia por slide). Render 1080x1350. -->
<html lang="pt-br">
<head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"></head>
<body class="canvas canvas--ig-vertical bg-dark grid-overlay">
  <div class="pad" style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:36px;">
    <div class="title title--lg accent">{{NUMERO_OU_PASSO}}</div>
    <h2 class="title title--md">{{TITULO_DO_PONTO}}</h2>
    <p class="body body--lg muted">{{TEXTO_CURTO_ATE_40_PALAVRAS}}</p>
  </div>
  <div class="footer"><span class="handle">@horus</span><span class="slide-num">{{N}} / {{TOTAL}}</span></div>
</body>
</html>
