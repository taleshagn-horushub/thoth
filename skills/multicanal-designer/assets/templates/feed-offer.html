<!doctype html>
<!-- ESTILO OFFER · IG feed 1080x1350. headline + sub + linhas (label/valor) + CTA.
     Use p/ ecossistema, planos, diagnóstico. Preço de SERVIÇO Horus é permitido (B2B);
     nunca honorário do advogado-cliente. -->
<html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"></head>
<body class="card canvas--feed">
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
  <div class="brand"><div class="emblem-ph"></div><span class="brand-name">Horus <span class="hub">Hub</span></span></div>
  <div class="body">
    <span class="kicker">{{KICKER}}</span>
    <div class="headline">{{HEADLINE_com_<span class="hl">DESTAQUE</span>}}</div>
    <div class="sub">{{SUBLINHA}}</div>
    <div class="rows">
      <div class="row"><span class="lbl">{{ITEM_1}}</span><span class="val">{{VALOR_1}}</span></div>
      <div class="row"><span class="lbl">{{ITEM_2}}</span><span class="val">{{VALOR_2}}</span></div>
      <!-- repita .row conforme necessário -->
    </div>
    <div class="pill">{{CTA_informativo}}</div>
  </div>
  <div class="foot"><span class="handle">@horushub.ia</span><span class="swipe">arraste →</span></div>
</body></html>
