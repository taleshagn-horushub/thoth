<!doctype html>
<!-- IG CAROUSEL · slide de DADO (número grande + fonte). Render 1080x1350. -->
<html lang="pt-br">
<head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"></head>
<body class="canvas canvas--ig-vertical bg-gradient-blue grid-overlay">
  <div class="pad" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:24px;">
    <div class="bignum">{{NUMERO}}</div>
    <h2 class="title title--md">{{O_QUE_O_NUMERO_SIGNIFICA}}</h2>
    <p class="source">Fonte: {{FONTE_DO_DADO}}</p>
  </div>
  <div class="footer"><span class="handle">@horus</span><span class="slide-num">{{N}} / {{TOTAL}}</span></div>
</body>
</html>
