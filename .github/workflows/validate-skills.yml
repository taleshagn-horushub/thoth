name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/validate.ts'
      - '.github/workflows/validate-skills.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  validate:
    name: Lint skill structure & references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      - name: Validate all skills
        run: npx tsx scripts/validate.ts

      - name: Check for absolute paths in SKILL.md files
        run: |
          if grep -rE '(/home/|C:\\\\Users\\\\|/Users/[A-Za-z]+/)' skills/ --include='SKILL.md'; then
            echo "::error::Found absolute paths in skill files. Use relative paths only."
            exit 1
          fi
